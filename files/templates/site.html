<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Сайт</title><style>
*{box-sizing:border-box;margin:0}
:root{--bg:#070b14;--panel:#0f1626;--line:rgba(148,163,184,.14);--txt:#e8eef8;--mut:#8fa3bf;
--acc:#38bdf8;--acc2:#6366f1;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
html{scroll-behavior:smooth}
body{display:block!important;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);color:var(--txt);line-height:1.55;font-size:15px;
background-image:radial-gradient(1100px 620px at 8% -12%,rgba(56,189,248,.13),transparent 62%),
radial-gradient(900px 620px at 96% -6%,rgba(99,102,241,.13),transparent 60%);background-attachment:fixed}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:#0a1120}
::-webkit-scrollbar-thumb{background:linear-gradient(#38bdf8,#6366f1);border-radius:8px;border:2px solid #0a1120}
a{color:var(--acc);text-decoration:none;transition:.15s}a:hover{color:#7dd3fc}
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
padding:14px 26px;background:rgba(10,16,28,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:650;flex:1;margin:0;letter-spacing:-.01em}
header a{font-size:13.5px;padding:7px 12px;border-radius:9px;border:1px solid transparent}
header a:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
main,.wrap{max-width:1280px;margin:0 auto;padding:24px 26px;width:100%}
h1{font-size:23px;font-weight:650;letter-spacing:-.02em;margin-bottom:14px}
h2{font-size:15.5px;font-weight:620;margin-bottom:14px;letter-spacing:-.01em}
.card{background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;transition:.2s}
.card:hover{border-color:rgba(148,163,184,.26)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{padding:9px 16px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);
border-radius:11px;cursor:pointer;font-size:13.5px;font-family:inherit;transition:.18s}
.tabs button:hover{background:rgba(255,255,255,.09)}
.tabs button.active{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#04121f;border-color:transparent;font-weight:650}
.tab{display:none}.tab.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
font-size:14px;font-family:inherit;background:rgba(6,11,20,.6);color:var(--txt);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
select option{background:#0f1626}
textarea{min-height:92px;resize:vertical}
textarea.big{min-height:250px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:0;border-radius:10px;
background:linear-gradient(90deg,var(--acc),var(--acc2));color:#04121f;font-weight:650;font-size:14px;cursor:pointer;font-family:inherit;transition:.18s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.o{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt)}
.btn.g{background:linear-gradient(90deg,#34d399,#10b981);color:#04231a}
.btn.r{background:linear-gradient(90deg,#f87171,#ef4444);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.msg{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.35);color:#bae6fd;
border-radius:11px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.55}
code{background:rgba(6,11,20,.7);border:1px solid var(--line);border-radius:6px;padding:2px 7px;
font-size:12.5px;color:#6ee7b7;font-family:ui-monospace,Menlo,monospace}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
tbody tr:hover,tr:hover{background:rgba(255,255,255,.025)}
.tablewrap{overflow-x:auto;border-radius:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:650}
.badge.on{background:rgba(52,211,153,.16);color:#6ee7b7}
.badge.off{background:rgba(248,113,113,.15);color:#fca5a5}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actions form{display:flex;gap:4px;align-items:center;margin:0}
.actions input{width:88px;padding:6px 9px;font-size:12px}
.bar{height:6px;background:rgba(148,163,184,.18);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#64748b;margin-right:7px}
.dot.ok{background:var(--ok);box-shadow:0 0 9px var(--ok)}.dot.bad{background:var(--bad)}
#xuiStatus{font-size:13px;color:var(--mut);display:inline-flex;align-items:center}
@media(max-width:720px){header{padding:12px 16px}main,.wrap{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main class=wrap style="padding:24px"><h1>🌐 Публичный сайт</h1>{% if msg %}<div class=msg>{{ msg }}</div>{% endif %}<div class=card><p class=hint>Нейтральный сайт IT-компании. <a href="/" target=_blank>Открыть →</a></p></div><form method=post action="/site"><div class=card><h2>Реквизиты</h2><div class=grid><div><label>Название</label><input name=site_name value="{{ s.site_name }}"></div><div><label>Телефон</label><input name=site_phone value="{{ s.site_phone }}"></div><div><label>Почта</label><input name=site_email value="{{ s.site_email }}"></div><div><label>ИНН</label><input name=site_inn value="{{ s.site_inn }}"></div><div><label>Адрес</label><input name=site_addr value="{{ s.site_addr }}"></div><div><label>Лет</label><input name=site_years value="{{ s.site_years }}"></div><div><label>Проектов</label><input name=site_projects value="{{ s.site_projects }}"></div><div><label>Доступность %</label><input name=site_uptime value="{{ s.site_uptime }}"></div></div><label>Подзаголовок</label><input name=site_tagline value="{{ s.site_tagline }}"><label>О компании</label><textarea name=site_about>{{ s.site_about }}</textarea><p style="margin-top:14px"><button class=btn>💾 Сохранить</button></p></div></form><p><a href="/">← В админку</a></p></main></body></html>
